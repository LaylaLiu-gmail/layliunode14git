trigger:
- none

pool:
  vmImage: 'windows-latest'

resources:
  repositories:
    - repository: githubRepo
      type: github
      name: LaylaLiu-gmail/layliunode14git
      endpoint: github.com_layliu_microsoft

variables:
  ref: $[ resources.repositories.githubRepo.ref ]
  name: $[ resources.repositories.githubRepo.name ]
  id: $[ resources.repositories.githubRepo.id ]
  type: $[ resources.repositories.githubRepo.type ]
  url: $[ resources.repositories.githubRepo.url ]
  version: $[ resources.repositories.githubRepo.version ]

steps:
- bash: |
    echo "name = $(name)"
    echo "ref = $(ref)"
    echo "id = $(id)"
    echo "type = $(type)"
    echo "url = $(url)"
    echo "version = $(version)"

- script: |
    git config --global --unset-all http.https://github.com/LaylaLiu-gmail/layliunode14git.extraheader
    echo "url: $(resources.repositorie.githubRepo.url)"
    echo "url: $(github.com_layliu_microsoft.)"
    
- checkout: self
  persistCredentials: true

- script: |
    git config 
    echo $(resources.repositories.githubRepo.url)
    git remote add github $(resources.repositories.githubRepo.url)
    git remote -v
    git push github "refs/remotes/origin/user/layliu/AllArc:user/layliu/AllArc"
  displayName: 'Push to GitHub'
  env:
    GIT_ASKPASS: /bin/echo

- script: |
    git config --global user.name 'azure-devops'
    git config --global user.email 'azure-devops@devops.com'

    cd $(Build.SourcesDirectory)
    git log
    git remote add github https://$(GITHUB_TOKEN)@github.com/LaylaLiu-gmail/layliunode14git.git
    git remote -v
    git push github --tags "refs/remotes/origin/*:refs/heads/*"
    git branch --all
    git push github --tags
    git branch --all
  displayName: 'Push to GitHub'

  github.com_layliu_microsoft